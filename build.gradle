plugins {
    id 'com.android.application' version '8.5.2' apply false
}

// Isolated widget trial. Public update metadata and releases are unchanged.
subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.application')) {
            p.android.defaultConfig.versionCode = 82
            p.android.defaultConfig.versionName = '3.1.3'
        }
    }
}
