<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة حمص</title>
<style>
:root{--gold:#d6b25e;--red:#ce1126;--w:#f4f1e8;--mut:#a9c2b4;--g:#0f4d36;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:min(1.15vw,2.9vh);height:100%}
body{height:100%;overflow:hidden;display:flex;flex-direction:column;color:var(--w);font-family:"Noto Naskh Arabic","Noto Sans Arabic",Roboto,Arial,sans-serif;background:radial-gradient(rgba(214,178,94,.09) 1px,transparent 1px) 0 0/2vw 2vw,linear-gradient(160deg,#0b3b2b,#04170f)}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.15fr 1.05fr;gap:1.1rem;padding:.2rem 1.6rem 0}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(214,178,94,.45);border-radius:1rem;padding:1rem 1.3rem;display:flex;flex-direction:column;min-height:0}
.c1{justify-content:space-between}
.city{display:flex;justify-content:space-between;align-items:center;font-size:1.7rem;color:var(--gold)}
.clock{font-size:7.4rem;line-height:1;font-weight:700;text-align:center;direction:ltr}
.clock small{font-size:2rem;color:var(--gold);margin-inline-start:.5rem}
.dates{text-align:center;font-size:1.5rem;line-height:1.6}.dates span{color:var(--gold)}
.info{text-align:center;font-size:1.25rem;line-height:1.5;color:var(--w);min-height:3.8rem;opacity:.85}
.c2{align-items:center;justify-content:center;text-align:center}
.c2 .tag{font-size:1.1rem;color:var(--gold)}
.c2 .ic{font-size:4.6rem;line-height:1.2}
.c2 .t{font-size:5.6rem;font-weight:700;line-height:1;direction:ltr}
.c2 .d{font-size:1.9rem;margin-top:.4rem}
.c2 .m{font-size:1.2rem;color:var(--mut);line-height:1.7;margin-top:.3rem}
.next{text-align:center;padding-bottom:.6rem;border-bottom:1px solid rgba(214,178,94,.35);margin-bottom:.4rem}
.next b{font-size:2.2rem;color:var(--gold);margin-inline-end:.8rem}
.next span{font-size:1.2rem;color:var(--mut)}
.next em{font-style:normal;font-size:1.9rem;direction:ltr;display:inline-block}
#pl{flex:1;display:flex;flex-direction:column;justify-content:space-around;min-height:0}
.p{display:flex;justify-content:space-between;font-size:1.8rem;padding:.2rem .9rem;border-radius:.6rem}
.p span:last-child{direction:ltr;font-weight:700}
.p.on{background:var(--g);border:1px solid var(--gold)}
.p.on span:first-child:before{content:"◄ ";color:var(--gold)}
header{position:relative;height:2.4rem;flex:none}
#nw{position:absolute;left:1.6rem;top:.45rem;width:1.5rem;height:1.5rem;color:#3ddc84;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#nw.off{color:#e04b4b}#sl{display:none}#nw.off #sl{display:block}
#eg{position:absolute;left:50%;top:.2rem;height:2.1rem;width:auto;transform:translateX(-50%);opacity:.6}
.c1{order:2;position:relative;overflow:hidden}
.c2{order:1}
.c3{order:3}
.c2,.c3{position:relative;overflow:hidden}
.c2::before,.c3::before{content:"";position:absolute;top:0;bottom:0;left:0;right:0;background:center/contain no-repeat;pointer-events:none}
.c2::before{background-image:url(map.webp);background-size:auto 100%;opacity:.11}
.c3::before{background-image:url(mosque.webp);opacity:.13}
.c2>*,.c3>*{position:relative}
.c1::before{content:"";position:absolute;top:0;bottom:0;left:0;right:0;background:url(tower.webp) center bottom/auto 100% no-repeat;opacity:.13;pointer-events:none}
.c1>*{position:relative}
.tm{display:flex;direction:ltr;align-items:baseline;gap:.5rem;font-weight:700}
.tm i{font-style:normal;font-weight:400;font-size:1.3rem;color:var(--mut)}
.tm b{font-weight:700}
</style>
</head>
<body>
<header>
<svg id="nw" viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16.2a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/><line id="sl" x1="3" y1="3" x2="21" y2="21"/></svg>
<img id="eg" src="eagle.png" alt="">
</header>
<main>
<section class="card c1">
  <div class="city"><span>حمص · سوريا</span></div>
  <div class="clock"><span id="hm">--:--</span><small id="sec"></small></div>
  <div class="dates" id="dates"></div>
  <div class="info" id="info"></div>
</section>
<section class="card c2">
  <div class="tag" id="wtag"></div>
  <div class="ic" id="wi"></div>
  <div class="t" id="wt">--°</div>
  <div class="d" id="wd"></div>
  <div class="m" id="wm"></div>
</section>
<section class="card c3" style="padding:.8rem 1.1rem">
  <div class="next"><b id="nn">--</b><span>بعد </span><em id="nc">--</em></div>
  <div id="pl"></div>
</section>
</main>
<script>
(function(){
var LAT=34.7324,LNG=36.7137,TZ=3,R=Math.PI/180;
var $=function(i){return document.getElementById(i)};
var MON=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
var DAY=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var NAMES=["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"];
var CLI=[[12,3],[14,4],[18,7],[24,11],[29,15],[33,19],[35,21],[36,22],[33,19],[28,14],[20,9],[14,5]];
function pt(y,m,d){
 var D=Date.UTC(y,m,d,12)/864e5+2440587.5-2451545;
 var g=(357.529+.98560028*D)%360*R,q=((280.459+.98564736*D)%360+360)%360;
 var L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*R,e=(23.439-4e-7*D)*R;
 var dec=Math.asin(Math.sin(e)*Math.sin(L));
 var ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;ra=(ra+24)%24;
 var eq=q/15-ra;eq=((eq+12)%24+24)%24-12;
 var noon=12+TZ-LNG/15-eq+.017;
 function h(a){return Math.acos((Math.sin(a*R)-Math.sin(LAT*R)*Math.sin(dec))/(Math.cos(LAT*R)*Math.cos(dec)))/R/15}
 var asr=Math.atan(1/(1+Math.tan(Math.abs(LAT*R-dec))))/R;
 return [noon-h(-18),noon-h(-.833),noon,noon+h(asr),noon+h(-.833),noon+h(-17)];
}
function f(x){x=((x%24)+24)%24;var m=Math.round(x*60),H=Math.floor(m/60)%24,M=m%60,p=H>=12?"م":"ص";H=H%12||12;return "<i>"+p+"</i><b>"+H+":"+(M<10?"0":"")+M+"</b>"}
function z(n){return n<10?"0"+n:n}
var key="",lastT="",dyn=["",""];
var k1=21.4225*R,k2=39.8262*R,p1=LAT*R,dl=k2-LNG*R;
var qb=Math.round((Math.atan2(Math.sin(dl)*Math.cos(k1),Math.cos(p1)*Math.sin(k1)-Math.sin(p1)*Math.cos(k1)*Math.cos(dl))/R+360)%360);
var facts=["حمص ثالث أكبر المدن السورية، وتقع على نهر العاصي","تقع حمص وسط سوريا على بُعد نحو 160 كم شمال دمشق","ترتفع حمص نحو 500 م عن سطح البحر، ومناخها متوسطي معتدل","كان اسمها القديم «إميسا»، وكانت مدينة مهمة في العصر الروماني","قلعة الحصن قرب حمص مدرجة على قائمة اليونسكو للتراث العالمي منذ 2006","جامع خالد بن الوليد من أشهر معالم حمص وأبرز مساجدها","كنيسة أم الزنار في حمص القديمة من أقدم كنائس سوريا","محافظة حمص أكبر محافظات سوريا مساحةً، وتضم مدينة تدمر الأثرية","تضم حمص جامعة البعث، إحدى الجامعات الحكومية السورية","بحيرة قطينة (بحيرة حمص) تقع جنوب غرب المدينة","«فتحة حمص» ممر طبيعي بين الجبال يسمح بوصول رياح البحر والأمطار للداخل","تُلقّب حمص بـ«أم الحجارة السوداء» نسبةً إلى حجارتها البازلتية","قريبة من وادي النصارى الذي يضم قلعة الحصن وقرى تاريخية","التوقيت في سوريا ثابت على GMT+3 طوال العام"];
function net(){$("nw").setAttribute("class",navigator.onLine?"":"off")}
window.addEventListener("online",net);window.addEventListener("offline",net);net();
function tick(){
 var n=new Date(Date.now()+TZ*36e5),Y=n.getUTCFullYear(),M=n.getUTCMonth(),Dd=n.getUTCDate(),H=n.getUTCHours(),Mi=n.getUTCMinutes(),S=n.getUTCSeconds();
 $("hm").textContent=((H%12)||12)+":"+z(Mi);$("sec").textContent=z(S)+" "+(H>=12?"م":"ص");
 var nh=H+Mi/60+S/3600,T=pt(Y,M,Dd),ni=-1,i;
 for(i=0;i<6;i++){if(T[i]>nh){ni=i;break}}
 var tt;if(ni<0){ni=0;tt=pt(Y,M,Dd+1)[0]+24}else tt=T[ni];
 var rem=Math.max(0,Math.round((tt-nh)*3600)),rh=Math.floor(rem/3600),rm=Math.floor(rem%3600/60),rs=rem%60;
 $("nn").textContent=NAMES[ni];$("nc").textContent=z(rh)+":"+z(rm)+":"+z(rs);
 var kk=Dd+"-"+ni;
 if(kk!==key){key=kk;var s="";for(i=0;i<6;i++)s+='<div class="p'+(i===ni?' on':'')+'"><span>'+NAMES[i]+'</span><span class="tm">'+f(T[i])+'</span></div>';$("pl").innerHTML=s;
  var hj="";try{hj=new Intl.DateTimeFormat("ar-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(n)}catch(e){}
  $("dates").innerHTML="<span>"+DAY[n.getUTCDay()]+"</span> "+Dd+" "+MON[M]+" "+Y+(hj?"<br>"+hj:"");
  var dayLen=T[4]-T[1],dh=Math.floor(dayLen),dm=Math.round((dayLen-dh)*60);
  dyn[0]="اتجاه القبلة من حمص: "+qb+"° من الشمال";
  dyn[1]="طول النهار اليوم: "+dh+" ساعة و"+dm+" دقيقة";
  if(!window.wLive){var c=CLI[M];$("wt").textContent=Math.round((c[0]+c[1])/2)+"°";$("wd").textContent="متوسط شهر "+MON[M];$("wm").textContent="العظمى "+c[0]+"° · الصغرى "+c[1]+"°";$("wi").textContent=c[0]>27?"☀️":c[0]>17?"⛅":"☁️";$("wtag").textContent="معدلات مناخية"}
 }
 var all=facts.concat(dyn).filter(Boolean),fi=Math.floor(Date.now()/12000)%all.length,tx="💡 "+all[fi];if(tx!==lastT){lastT=tx;$("info").textContent=tx}
}
function wc(c){if(c===0)return["صافٍ","☀️"];if(c<3)return["غائم جزئياً","⛅"];if(c===3)return["غائم","☁️"];if(c<50)return["ضباب","🌫️"];if(c<68)return["مطر","🌧️"];if(c<78)return["ثلوج","❄️"];if(c<83)return["زخات مطر","🌦️"];return["عاصفة رعدية","⛈️"]}
function weather(){
 try{fetch("https://api.open-meteo.com/v1/forecast?latitude=34.73&longitude=36.71&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FDamascus")
 .then(function(r){return r.json()}).then(function(j){var c=j.current,d=j.daily,w=wc(c.weather_code);window.wLive=1;
  $("wt").textContent=Math.round(c.temperature_2m)+"°";$("wd").textContent=w[0];$("wi").textContent=w[1];$("wtag").textContent="الآن في حمص";
  $("wm").innerHTML="العظمى "+Math.round(d.temperature_2m_max[0])+"° · الصغرى "+Math.round(d.temperature_2m_min[0])+"°<br>رطوبة "+c.relative_humidity_2m+"% · رياح "+Math.round(c.wind_speed_10m)+" كم/س"}).catch(function(){})}catch(e){}
}
tick();setInterval(tick,1000);weather();setInterval(weather,18e5);
})();
</script>
</body>
</html>
