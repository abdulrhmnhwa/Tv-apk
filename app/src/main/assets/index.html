function wc(c){if(c===0)return["صافٍ","☀️"];if(c<3)return["غائم جزئياً","⛅"];if(c===3)return["غائم","☁️"];if(c<50)return["ضباب","🌫️"];if(c<68)return["مطر","🌧️"];if(c<78)return["ثلوج","❄️"];if(c<83)return["زخات مطر","🌦️"];return["عاصفة رعدية","⛈️"]}
function weather(){
 try{fetch("https://api.open-meteo.com/v1/forecast?latitude=34.73&longitude=36.71&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=5&timezone=Asia%2FDamascus")
 .then(function(r){return r.json()}).then(function(j){var c=j.current,d=j.daily,w=wc(c.weather_code);window.wLive=1;
  $("wt").textContent=Math.round(c.temperature_2m)+"°";$("wd").textContent=w[0];$("wi").textContent=w[1];$("wtag").textContent="الآن في حمص";
  var rn=d.precipitation_probability_max&&d.precipitation_probability_max[0]!=null?"<br>احتمال المطر اليوم "+d.precipitation_probability_max[0]+"%":"";
  $("wm").innerHTML="العظمى "+Math.round(d.temperature_2m_max[0])+"° · الصغرى "+Math.round(d.temperature_2m_min[0])+"°<br>رطوبة "+c.relative_humidity_2m+"% · رياح "+Math.round(c.wind_speed_10m)+" كم/س"+rn;
  var s="";for(var i=1;i<d.time.length&&i<5;i++){var g=wc(d.weather_code[i]),dn=DAY[new Date(d.time[i]+"T12:00:00Z").getUTCDay()];
   s+='<div class="fc"><span>'+dn+'</span><u>'+g[1]+'</u><b>'+Math.round(d.temperature_2m_max[i])+'°</b><s>'+Math.round(d.temperature_2m_min[i])+'°</s></div>'}
  $("fc").innerHTML=s;$("fc").style.display="flex"}).catch(function(){})}catch(e){}
}
var sOpen=false,sIdx=0,svT;
function saveAdj(){clearTimeout(svT);svT=setTimeout(function(){var j=JSON.stringify({adj:adj});try{if(window.App)App.save(j);else localStorage.setItem("cfg",j)}catch(e){}},300)}
function sRender(){var n=new Date(Date.now()+TZ*36e5),T=PT(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()),h="",i;
 for(i=0;i<6;i++)h+='<div class="sx'+(sIdx===i?' f':'')+'"><span>'+NAMES[i]+'<small>'+f2(T[i])+'</small></span><div class="sv"><i>◄</i><span><b>'+(adj[i]>0?"+":"")+adj[i]+'</b><em>د</em></span><i>►</i></div></div>';
 h+='<div class="sx'+(sIdx===6?' f':'')+'"><span>تكبير الأذان</span><div class="sv"><i>◄</i><span style="font-size:1.7rem">'+(adhanOn?"مفعّل":"متوقف")+'</span><i>►</i></div></div>';
 h+='<div class="sx'+(sIdx===7?' f':'')+'"><span>إعادة ضبط الدقائق</span><div class="sv"><span style="font-size:1.5rem">OK</span></div></div>';
 h+='<div class="sx'+(sIdx===8?' f':'')+'"><span>حفظ وإغلاق</span><div class="sv"><span style="font-size:1.5rem">OK</span></div></div>';
 $("sl2").innerHTML=h}
function sClose(){sOpen=false;try{if(window.App)App.setSettings(false)}catch(e){}$("set").className="";saveAdj();key=""}
function togAd(){adhanOn=!adhanOn;try{if(window.App)App.setAdhan(adhanOn)}catch(e){}$("ad").textContent=adhanOn?"🔔":"🔕"}
window.openSettings=function(){sOpen=true;sIdx=0;try{if(window.App)App.setSettings(true)}catch(e){}$("set").className="on";sRender()};
window.rk=function(k){if(!sOpen)return;
 if(k==="back"){sClose();return}
 if(k==="up")sIdx=(sIdx+8)%9;else if(k==="down")sIdx=(sIdx+1)%9;
 else if(k==="left"||k==="right"){var d=k==="right"?1:-1;if(sIdx<6){adj[sIdx]=Math.max(-60,Math.min(60,adj[sIdx]+d));saveAdj()}else if(sIdx===6)togAd()}
 else if(k==="ok"){if(sIdx===6)togAd();else if(sIdx===7){adj=[0,0,0,0,0,0];saveAdj()}else if(sIdx===8){sClose();return}}
 sRender()};
if(!window.App)document.addEventListener("keydown",function(e){var m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",Enter:"ok",Escape:"back"}[e.key];if(!m)return;if(!sOpen&&m==="ok")window.openSettings();else window.rk(m)});
tick();setInterval(tick,1000);weather();setInterval(weather,18e5);
})();
</script>
