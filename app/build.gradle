plugins {
    id 'com.android.application'
}
android {
    namespace 'sy.homs.mobile'
    compileSdk 34
    defaultConfig {
        applicationId "sy.homs.mobile"
        minSdk 21
        targetSdk 34
        versionCode 23
        versionName "1.9.10"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
