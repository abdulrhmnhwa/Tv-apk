plugins {
    id 'com.android.application'
}
android {
    namespace 'sy.homs.mobile'
    compileSdk 34
    defaultConfig {
        applicationId "sy.homs.mobile"
        minSdk 21
        targetSdk 34
        versionCode 53
        versionName "2.5.3"
    }
    signingConfigs {
        homs {
            storeFile file('homs.keystore')
            storePassword 'homs1234'
            keyAlias 'homs'
            keyPassword 'homs1234'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.homs }
        release { minifyEnabled false; signingConfig signingConfigs.homs }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
