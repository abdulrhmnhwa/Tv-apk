plugins {
    id 'com.android.application'
}
android {
    namespace 'sy.homs.dash'
    compileSdk 34
    defaultConfig {
        applicationId "sy.homs.dash"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "3.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
