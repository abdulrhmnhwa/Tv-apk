plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'sy.homs.mobile'
    compileSdk 34
    defaultConfig {
        applicationId "sy.homs.mobile"
        minSdk 21
        targetSdk 34
        versionCode 108
        versionName "3.4.0"
    }
    // التوقيع لا يُحفظ بالمستودع: نسخة release تُبنى بدون توقيع ثم يوقّعها مسار GitHub Actions بمفاتيح الأسرار الخاصة.
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
