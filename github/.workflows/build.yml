name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --console=plain > build.log 2>&1
      - name: Show errors
        if: failure()
        run: |
          grep -nE "error:|What went wrong|Execution failed|Caused by|Manifest merger|FAILED" -A4 build.log | head -80
          echo ----- LAST LINES -----
          tail -40 build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HomsTV-apk
          path: app/build/outputs/apk/debug/*.apk
