name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HomsTV-apk
          path: app/build/outputs/apk/debug/*.apk
      # نشر الـ APK كإصدار (Release) برابط تحميل مباشر ثابت يستخدمه نظام التحديث
      - name: قراءة رقم النسخة
        run: echo "VN=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: النسخة ${{ env.VN }}
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
